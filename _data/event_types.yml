# The kinds of event, and the colour each one gets on the site.
# An event in _data/events.yml picks one of these by its key (workshop, company, ...).
#
# Rename `label` freely — that is the text people see. Keep the key on the left
# stable, or update the events that use it. `colour` is one of the brand
# colours: lime, blue, gold, coral.

workshop:
  label: Workshop
  colour: lime
  about: Hands-on session run by members. Bring a laptop.

company:
  label: Company workshop
  colour: blue
  about: Run with, or at, a company.

talk:
  label: Talk
  colour: gold
  about: A speaker, a presentation, or an intro to the club.

social:
  label: Social
  colour: coral
  about: No agenda. Meet the people.
